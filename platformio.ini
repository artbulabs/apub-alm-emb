[env:native]
platform = native
test_framework = googletest
lib_compat_mode = off
build_flags =
    -D BOARD_NATIVE
    -Wall
    -Wextra
    -Wpedantic
    -Werror
    -I include
build_src_filter = +<*> -<main.cpp> -<main_espcam.cpp> -<main_lilygo.cpp>

[env:native_san]
platform = native
test_framework = googletest
lib_compat_mode = off
build_flags =
    -D BOARD_NATIVE
    -Wall
    -Wextra
    -Wpedantic
    -Werror
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -g
    -I include
build_src_filter = +<*> -<main.cpp> -<main_espcam.cpp> -<main_lilygo.cpp>

[env:native_cov]
platform = native
test_framework = googletest
lib_compat_mode = off
build_flags =
    -D BOARD_NATIVE
    -Wall
    -Wextra
    -Wpedantic
    -Werror
    --coverage
    -fprofile-arcs
    -ftest-coverage
    -lgcov
    -I include
build_src_filter = +<*> -<main.cpp> -<main_espcam.cpp> -<main_lilygo.cpp>

[env:devkit]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
monitor_filters = send_on_enter
build_flags =
    -D BOARD_DEVKIT
    -Wall
    -Wextra
    -I include
lib_ldf_mode = deep+
build_src_filter = +<*> -<main_espcam.cpp> -<main_lilygo.cpp>

[env:lilygo]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
monitor_filters = send_on_enter
build_flags =
    -D BOARD_LILYGO
    -Wall
    -Wextra
    -I include
lib_ldf_mode = deep+
build_src_filter = +<*> -<main.cpp> -<main_espcam.cpp>

[env:espcam]
platform = espressif32
board = esp32cam
framework = arduino
upload_speed = 38400
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -D BOARD_ESPCAM
    -Wall
    -Wextra
lib_ldf_mode = deep+
build_src_filter = +<*> -<main.cpp> -<main_lilygo.cpp>
