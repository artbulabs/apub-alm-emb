[env:native]
platform = native
test_framework = googletest
lib_compat_mode = off
build_flags = -D BOARD_NATIVE
build_src_filter = +<*> -<main.cpp>

[env:devkit]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
build_flags = -D BOARD_DEVKIT
lib_ldf_mode = deep+

[env:lilygo]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
build_flags = -D BOARD_LILYGO
lib_ldf_mode = deep+
