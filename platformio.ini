[env:native]
platform = native
test_framework = googletest
lib_compat_mode = off
build_flags =
    -D BOARD_NATIVE
    -Wall
    -Wextra
    -Wpedantic
    -Werror
build_src_filter = +<*> -<main.cpp>

[env:native_san]
platform = native
test_framework = googletest
lib_compat_mode = off
build_flags =
    -D BOARD_NATIVE
    -Wall
    -Wextra
    -Wpedantic
    -Werror
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -g
build_src_filter = +<*> -<main.cpp>

[env:native_cov]
platform = native
test_framework = googletest
lib_compat_mode = off
build_flags =
    -D BOARD_NATIVE
    -Wall
    -Wextra
    -Wpedantic
    -Werror
    --coverage
    -fprofile-arcs
    -ftest-coverage
    -lgcov
build_src_filter = +<*> -<main.cpp>

[env:devkit]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
monitor_filters = send_on_enter
build_flags =
    -D BOARD_DEVKIT
    -Wall
    -Wextra
lib_ldf_mode = deep+

[env:lilygo]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
build_flags =
    -D BOARD_LILYGO
    -Wall
    -Wextra
lib_ldf_mode = deep+
